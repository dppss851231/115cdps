<title>國語二上挑戰島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：全螢幕低多邊形島嶼地圖，上方浮動控制列，點島後右側展開挑戰面板（手機為下方抽屜） */
:root{
  --sky:#d9e8dc; --water:#62b2bf; --sand:#ead7ac; --grass:#a3c77c;
  --paper:#fffdf8; --ink:#27363a; --muted:#5f7176; --line:#e3ddd0;
  --accent:#e0643a; --accent-ink:#ffffff; --accent-soft:#fbe4d9;
  --good:#2f9a5d; --good-soft:#dff2e6; --bad:#d2453b; --bad-soft:#fbe3e0;
  --star:#f2b11c; --chip:#f3efe5; --shadow:0 10px 30px rgba(39,54,58,.18);
  --f-display:"Huninn","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --sky:#1d2a33; --water:#2c6773; --sand:#bfa77c; --grass:#6f9653;
  --paper:#1f2a2e; --ink:#eef3f1; --muted:#a6b6b9; --line:#33454a;
  --accent:#ff8a5c; --accent-ink:#1d1410; --accent-soft:#4a2c22;
  --good:#5fd08f; --good-soft:#1e3a2b; --bad:#ff7a6e; --bad-soft:#47231f;
  --star:#ffc93d; --chip:#2a383c; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --sky:#1d2a33; --water:#2c6773; --sand:#bfa77c; --grass:#6f9653;
  --paper:#1f2a2e; --ink:#eef3f1; --muted:#a6b6b9; --line:#33454a;
  --accent:#ff8a5c; --accent-ink:#1d1410; --accent-soft:#4a2c22;
  --good:#5fd08f; --good-soft:#1e3a2b; --bad:#ff7a6e; --bad-soft:#47231f;
  --star:#ffc93d; --chip:#2a383c; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;overflow:hidden}
button{font-family:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:fixed;inset:0}
#stage canvas{display:block;touch-action:none}

/* 上方控制列 */
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:14px 16px;pointer-events:none;z-index:5;flex-wrap:wrap}
.hud>*{pointer-events:auto}
.brand{background:var(--paper);border-radius:18px;box-shadow:var(--shadow);padding:10px 18px 12px;display:flex;align-items:center;gap:14px}
.brand .big{font-family:var(--f-display);font-size:30px;line-height:1;color:var(--accent);letter-spacing:.04em}
.brand .sub{display:flex;flex-direction:column;gap:2px}
.brand .sub b{font-size:17px;font-weight:900}
.brand .sub span{font-size:12px;color:var(--muted);letter-spacing:.12em}
.tools{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tool{background:var(--paper);border:0;border-radius:14px;box-shadow:var(--shadow);padding:10px 14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;min-height:44px}
.tool:hover{background:var(--chip)}
.tool.score{cursor:default;font-variant-numeric:tabular-nums}
.tool.score:hover{background:var(--paper)}
.tool svg{width:18px;height:18px}
.starI{color:var(--star)}

/* 地圖上的島嶼標籤 */
#pins{position:fixed;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;background:var(--paper);border:0;border-radius:999px;box-shadow:0 4px 14px rgba(39,54,58,.22);padding:6px 14px 6px 8px;display:flex;align-items:center;gap:8px;cursor:pointer;white-space:nowrap;font-size:16px;font-weight:700;transition:transform .15s}
.pin:hover{transform:translate(-50%,-100%) scale(1.07)}
.pin .no{font-family:var(--f-display);color:var(--accent-ink);background:var(--accent);border-radius:999px;min-width:30px;height:30px;display:grid;place-items:center;font-size:15px}
.pin .st{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.pin.done .no{background:var(--good)}
.pin.home{padding:6px 14px;cursor:default;font-family:var(--f-display);font-weight:400}
.pin.home:hover{transform:translate(-50%,-100%)}
.hint{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--paper);border-radius:999px;box-shadow:var(--shadow);padding:10px 20px;font-size:15px;z-index:4;text-align:center;max-width:calc(100% - 32px)}

/* 清單模式（備援 & 手機好點） */
#list{position:fixed;inset:0;z-index:6;background:var(--sky);overflow:auto;padding:96px 16px 32px}
#list .grid{max-width:900px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.lcard{background:var(--paper);border:0;border-radius:20px;box-shadow:var(--shadow);padding:18px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.lcard .no{font-family:var(--f-display);color:var(--accent);font-size:15px;letter-spacing:.1em}
.lcard b{font-family:var(--f-display);font-weight:400;font-size:26px}
.lcard .meta{color:var(--muted);font-size:14px}
.stars{display:flex;gap:2px;font-size:20px;color:var(--line)}
.stars .on{color:var(--star)}

/* 挑戰面板 */
#panel{position:fixed;z-index:10;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);box-shadow:-10px 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#panel.open{transform:none}
#scrim{position:fixed;inset:0;z-index:9;background:rgba(20,30,33,.35);opacity:0;pointer-events:none;transition:opacity .3s}
#scrim.open{opacity:1;pointer-events:auto}
.phead{display:flex;align-items:center;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.phead h2{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;flex:1;min-width:0;text-wrap:balance}
.phead .tag{font-family:var(--f-display);background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:4px 10px;font-size:15px}
.iconbtn{background:var(--chip);border:0;border-radius:12px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:22px;height:22px}
.pbody{flex:1;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.intro{color:var(--muted);font-size:15px;line-height:1.7;margin:0}
.task{display:flex;align-items:center;gap:14px;background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.task:hover{border-color:var(--accent)}
.task .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-size:26px;flex:none;background:var(--accent-soft);color:var(--accent)}
.task .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.task .tx b{font-size:18px}
.task .tx span{font-size:13px;color:var(--muted)}
.task .bd{font-size:26px;color:var(--line)}
.task.got{border-color:var(--good);background:var(--good-soft)}
.task.got .bd{color:var(--star)}
.task.got .ic{background:var(--good);color:var(--paper)}
.island-stars{display:flex;align-items:center;gap:10px;background:var(--chip);border-radius:16px;padding:12px 16px;font-weight:700}
.island-stars .stars{font-size:24px}

/* 題目 */
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex:1}
.dots i{flex:1;height:8px;border-radius:99px;background:var(--line);max-width:44px}
.dots i.ok{background:var(--good)} .dots i.no{background:var(--bad)} .dots i.now{background:var(--accent)}
.qcount{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.passage{background:var(--chip);border-radius:16px;padding:14px 16px;line-height:1.95;font-size:17px}
.passage h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:20px;flex:1;min-width:0}
.passage .ph{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.say .i-play,.say .i-stop{display:grid;place-items:center}
.say .i-play svg,.say .i-stop svg{width:22px;height:22px}
.say:not(.speaking) .i-stop{display:none}
.say.speaking .i-play{display:none}
.say.speaking{background:var(--accent);color:var(--accent-ink)}
.say.wide{width:auto;padding:0 12px;gap:6px;display:flex;align-items:center;font-size:15px;font-weight:700}
.passage p{margin:0;text-indent:2em}
.qcard{display:flex;gap:10px;align-items:flex-start}
.qtext{flex:1;min-width:0;font-size:21px;line-height:1.7;font-weight:700;margin:0}
.qtext .blank{display:inline-block;min-width:2.2em;border-bottom:3px solid var(--accent);text-align:center;color:var(--accent)}
.qtext .parts{display:inline-flex;gap:6px;align-items:center}
.qtext .pt{font-family:var(--f-display);font-weight:400;background:var(--accent-soft);color:var(--accent);border-radius:10px;padding:0 10px;font-size:28px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.long{grid-template-columns:1fr}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px;font-size:19px;cursor:pointer;text-align:left;display:flex;gap:10px;align-items:center;min-height:60px;line-height:1.5}
.opt .k{flex:none;width:30px;height:30px;border-radius:99px;background:var(--chip);display:grid;place-items:center;font-size:14px;font-weight:700}
.opt.big{font-family:var(--f-display);font-size:34px;justify-content:center;padding:10px}
.opt.big .k{display:none}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{border-radius:16px;padding:14px 16px;line-height:1.7;font-size:16px;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fb b{font-size:19px}
.fb.ok b{color:var(--good)} .fb.no b{color:var(--bad)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 20px;font-size:18px;font-weight:900;cursor:pointer;min-height:52px}
.secondary{background:var(--chip);border:0;border-radius:14px;padding:14px 20px;font-size:17px;font-weight:700;cursor:pointer;min-height:52px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1}
.result{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:20px}
.result .bigstar{font-size:96px;line-height:1;color:var(--line)}
.result .bigstar.on{color:var(--star);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
.result h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:30px}
.result p{margin:0;color:var(--muted);font-size:17px;line-height:1.7}
.score{font-family:var(--f-display);font-size:48px;color:var(--accent);font-variant-numeric:tabular-nums}
@keyframes pop{from{transform:scale(.2) rotate(-40deg)}to{transform:none}}

/* 確認框 */
#confirm{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(20,30,33,.45);padding:16px}
#confirm .box{background:var(--paper);border-radius:20px;padding:22px;max-width:360px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
#confirm h3{margin:0;font-family:var(--f-display);font-weight:400;font-size:22px}
#confirm p{margin:0;color:var(--muted);line-height:1.6}

@media (max-width:640px){
  .brand{padding:8px 14px}
  .brand .big{font-size:24px}
  .tool .lbl{display:none}
  #panel{top:auto;height:88%;width:100%;border-radius:22px 22px 0 0;transform:translateY(105%)}
  .opts{grid-template-columns:1fr}
  .opts.chars{grid-template-columns:1fr 1fr}
  .qtext{font-size:19px}
  .pin{font-size:14px;padding:4px 10px 4px 6px}
  .pin .no{min-width:24px;height:24px;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

// 報讀：長文切成句子依序唸（避免瀏覽器唸到一半中斷）；換題、返回、關閉時立即停止
let speakToken = 0, speakBtn = null;

// 只選「國語」語音：臺灣國語優先，其次中國普通話；排除粵語（zh-HK / yue）
let zhVoice = null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices() || [];
    let best = null, bestScore = -1;
    vs.forEach(v=>{
      const lang = (v.lang||'').replace('_','-').toLowerCase(), name = v.name||'';
      if(!/^(zh|cmn)/.test(lang)) return;
      if(/hk|yue|mo$/.test(lang) || /粵|廣東|Cantonese|Hong ?Kong|Sin-?ji|Tracy|Danny|HiuGaai|HiuMaan|WanLung/i.test(name)) return;
      let s = 0;
      if(/tw|hant/.test(lang) || /臺灣|台灣|Taiwan|HsiaoChen|HsiaoYu|Yating|YunJhe|Hanhan|Zhiwei|Mei-?Jia/i.test(name)) s += 100;
      else if(/cn|hans|cmn/.test(lang)) s += 50;
      if(/Natural|Online|Neural|Premium|Enhanced|Google/i.test(name)) s += 20;
      if(v.localService===false) s += 2;
      if(s > bestScore){ best = v; bestScore = s; }
    });
    zhVoice = best;
  }catch(e){}
  return zhVoice;
}
try{ if('speechSynthesis' in window){ pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); } }catch(e){}

// 發音校正：只改「唸出來的聲音」，畫面上的字不變（用同音字避開破音字誤讀）
const SAY_FIX = [
  ['藺相如','吝象如'], ['廉頗','廉坡'], ['簞食瓢飲','單四瓢飲'], ['叱吒','斥詐'],
  ['鼎邊趖','鼎邊梭'], ['碗粿','碗果'], ['焚膏繼晷','焚高繼鬼'], ['寓教於樂','寓教於勒'],
  ['凹凸','凹圖'], ['協調','協條'], ['創作','愴作'], ['背著','揹著'], ['長滿','漲滿'],
  ['○','零'], ['鹿柴','鹿寨'], ['返景','返影'], ['柵欄','炸欄'], ['敷衍了事','敷衍瞭事'],
  ['如法炮製','如法袍製'], ['菲薄','匪薄'], ['不亦樂乎','不亦勒乎'], ['自得其樂','自得其勒'],
  ['長出','漲出'], ['長得','漲得'], ['越長越','越漲越']
];
function fixSay(t){ SAY_FIX.forEach(([a,b])=>{ t = t.split(a).join(b); }); return t; }
// 部件名稱：偏旁用老師上課的叫法，罕用部件用同音字唸出正確讀音
const PART_SAY = {
  '扌':'提手旁','氵':'三點水','亻':'單人旁','辶':'辵字旁','忄':'豎心旁','彳':'雙人旁','阝':'阜字旁',
  '刂':'立刀旁','攵':'反文旁','衤':'衣字旁','广':'眼字頭','糸':'密','气':'氣','豦':'巨','咅':'剖',
  '戠':'直','雚':'灌','昜':'陽','丞':'成','咢':'餓','夬':'怪','缶':'否','复':'富','奄':'眼',
  '禺':'魚','黽':'敏','聿':'玉','堯':'搖','雍':'庸','閏':'潤','韋':'圍','豕':'史','尹':'引',
  '辟':'必','采':'彩','予':'雨','叟':'搜','屯':'囤','虫':'蟲',
  '桼':'七','攸':'優','忝':'舔','夆':'逢','枼':'葉','粦':'林','巠':'經','樊':'凡','爫':'爪字頭','囗':'大口框',
  '曷':'何','甫':'府','坴':'路','兌':'對','隹':'追','犭':'犬字旁','弗':'服','舀':'咬','罒':'四字頭','門':'門字框'
};
// 同一個偏旁在左、右邊名稱不同時，整組指定唸法
const PART_SAY_PAIR = { '粦+阝':'林，加上，邑字旁' };
function stopSpeak(){
  speakToken++;
  try{ if('speechSynthesis' in window) speechSynthesis.cancel(); }catch(e){}
  if(speakBtn){ speakBtn.classList.remove('speaking'); speakBtn.setAttribute('aria-pressed','false'); speakBtn = null; }
}
function speak(text, btn){
  text=String(text).replace(/[\u{E0100}-\u{E01EF}]/gu,"");
  if(btn && btn===speakBtn){ stopSpeak(); return; } // 再按一次 = 停止
  stopSpeak();
  try{
    if(!('speechSynthesis' in window)) return;
    const token = speakToken;
    const parts = (fixSay(text.replace(/\{_\}/g,'空格')).match(/[^。！？；]+[。！？；」]*/g) || []).map(s=>s.trim()).filter(Boolean);
    if(btn){ speakBtn = btn; btn.classList.add('speaking'); btn.setAttribute('aria-pressed','true'); }
    let i = 0, v = null;
    const next = ()=>{
      if(token!==speakToken) return;
      if(i>=parts.length){ if(speakBtn===btn) stopSpeak(); return; }
      const u = new SpeechSynthesisUtterance(parts[i++]);
      u.rate = 0.85;
      if(v){ u.voice = v; u.lang = v.lang; } else u.lang = 'zh-TW';
      u.onend = next; u.onerror = ()=>{ if(token===speakToken && speakBtn===btn) stopSpeak(); };
      speechSynthesis.speak(u);
    };
    // 有些瀏覽器第一次載入時語音清單還是空的：最多等 1.5 秒，拿到國語語音再開始唸
    v = zhVoice || pickVoice();
    if(v) next();
    else {
      let started = false;
      const go = ()=>{ if(started) return; started = true; speechSynthesis.removeEventListener('voiceschanged', go); v = zhVoice || pickVoice(); next(); };
      speechSynthesis.addEventListener('voiceschanged', go);
      setTimeout(go, 1500);
    }
  }catch(e){}
}

function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function startQuiz(tk){
  const src = cur[tk];
  quiz = { tk, list: shuffle(src.map(q=>({...q, ans:q.o[0], opts:shuffle(q.o)}))), i:0, marks:[], answered:false };
  if(tk==='read') quiz.list = src.map(q=>({...q, ans:q.o[0], opts:shuffle(q.o)})); // 閱讀測驗照順序
  const t = TASKS.find(t=>t.key===tk);
  $('#ptitle').textContent = t.name;
  $('#pback').hidden = false;
  renderQ();
}
function qHTML(q){
  if(quiz.tk==='part'){
    return '這些部件合起來是哪個字？<br><span class="parts">'+q.parts.map(p=>'<span class="pt">'+p+'</span>').join('<span>＋</span>')+'</span>';
  }
  return q.q.replace(/\{_\}/g,'<span class="blank">'+(quiz.answered?q.ans:'？')+'</span>');
}
function speakText(q){
  const opts = '選項：'+q.opts.map((o,i)=>'ABCD'[i]+'，'+o).join('。')+'。';
  if(quiz.tk==='part') return '這些部件合起來是哪個字？'+(PART_SAY_PAIR[q.parts.join('+')]||q.parts.map(p=>PART_SAY[p]||p).join('，加上，'))+'。'+opts;
  if(quiz.tk==='char'){
    // 生字：唸出完整句子，再問「客廳的廳，是哪一個？」，不唸選項
    const sentence = q.q.replace(/\{_\}/g, q.ans).replace(/[。！？]$/,'');
    const w = q.w || q.ans, sw = fixSay(w), k = w.indexOf(q.ans);
    const ch = k>=0 ? sw[k] : q.ans;
    return sentence + '。' + sw + '的' + ch + '，是哪一個？';
  }
  return q.q.replace(/[。！？]$/,'')+'。'+opts;
}
const sayBtn = (id,label,text) => '<button class="iconbtn say'+(text?' wide':'')+'" id="'+id+'" type="button" aria-label="'+label+'" aria-pressed="false" title="'+label+'（再按一次停止）"><span class="i-play">'+SPEAKER+'</span><span class="i-stop">'+STOPICON+'</span>'+(text?'<span class="say-t">'+text+'</span>':'')+'</button>';
function renderQ(){

function answer(btn){
  if(quiz.answered) return;
  quiz.answered = true;
  const q = quiz.list[quiz.i], ok = btn.dataset.v===q.ans;

  const blank = pbody.querySelector('.blank'); if(blank) blank.textContent=q.ans;
  const dots = pbody.querySelectorAll('.dots i'); dots[quiz.i].className = ok?'ok':'no';

function result(){

  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 500);
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.08;
  controls.minDistance = 22; controls.maxDistance = 75;
  controls.maxPolarAngle = 1.18; controls.minPolarAngle = 0.35;
  controls.enablePan = false;
  controls.target.set(0,0,1);

  const hemi = new THREE.HemisphereLight(0xffffff, 0x8fb3a8, 0.75); scene.add(hemi);
  const sun = new THREE.DirectionalLight(0xfff3dc, 0.85);
  sun.position.set(-25,40,20); sun.castShadow = true;
  sun.shadow.mapSize.set(2048,2048);
  Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:120});
  sun.shadow.bias = -0.0008;
  scene.add(sun);

  const M = c => new THREE.MeshLambertMaterial({color:c, flatShading:true});
  const mats = {
    sand:M(0xead7ac), grass:M(0xa3c77c), grass2:M(0x8fbb6a), rock:M(0xb9b2a3), trunk:M(0x8a6248),
    leaf:M(0x6fa85a), leaf2:M(0x88b968), pine:M(0x4f8f5a), white:M(0xfbf8f1), roof:M(0xe0643a),
    roof2:M(0xd9a441), wood:M(0xb98a5e), red:M(0xd94a3a), gold:M(0xf2b11c), dark:M(0x3b4a4f),
    blue:M(0x4f8fc0), pink:M(0xe98aa0), cream:M(0xf3e6c8)
  };
  const water = new THREE.Mesh(new THREE.CircleGeometry(220,64), new THREE.MeshLambertMaterial({color:0x62b2bf}));
  water.rotation.x = -Math.PI/2; water.position.y = -0.35; water.receiveShadow = true; scene.add(water);

  function applyTheme(){
    const sky = new THREE.Color(css('--sky')||'#d9e8dc');
    scene.background = sky; scene.fog = new THREE.Fog(sky, 70, 150);
    water.material.color.set(css('--water')||'#62b2bf');
    const dark = sky.getHSL({}).l < 0.3;
    hemi.intensity = dark ? 0.55 : 0.75; sun.intensity = dark ? 0.6 : 0.85;
  }
  applyTheme();
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
  new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

  // 亂數（固定種子，讓樹的位置每次一樣）
  let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
  const mesh = (geo, mat, x=0,y=0,z=0, shadow=true) => { const m=new THREE.Mesh(geo,mat); m.position.set(x,y,z); m.castShadow=shadow; m.receiveShadow=true; return m; };

  function tree(g, x, z, s=1){
    const t = new THREE.Group();
    if(rnd()<0.45){
      t.add(mesh(new THREE.CylinderGeometry(0.08*s,0.1*s,0.5*s,5), mats.trunk, 0,0.25*s,0));
      t.add(mesh(new THREE.ConeGeometry(0.5*s,1.3*s,6), mats.pine, 0,1.05*s,0));
    } else {
      t.add(mesh(new THREE.CylinderGeometry(0.08*s,0.11*s,0.6*s,5), mats.trunk, 0,0.3*s,0));
      t.add(mesh(new THREE.IcosahedronGeometry(0.55*s,0), rnd()<0.5?mats.leaf:mats.leaf2, 0,0.95*s,0));
    }
    t.position.set(x,0,z); t.rotation.y = rnd()*6; g.add(t);
  }
  function house(g, x, z, rot=0, roofMat=mats.roof){
    const h = new THREE.Group();
    h.add(mesh(new THREE.BoxGeometry(1,0.8,0.9), mats.white, 0,0.4,0));
    const r = mesh(new THREE.ConeGeometry(0.85,0.6,4), roofMat, 0,1.1,0); r.rotation.y=Math.PI/4; h.add(r);
    h.position.set(x,0,z); h.rotation.y=rot; g.add(h);
  }
  function person(g, x, z, c){
    const p = new THREE.Group();
    p.add(mesh(new THREE.CylinderGeometry(0.14,0.17,0.4,6), M(c), 0,0.2,0));
    p.add(mesh(new THREE.SphereGeometry(0.13,8,6), mats.cream, 0,0.52,0));
    p.position.set(x,0,z); g.add(p); return p;
  }
  function islandBase(r, sides=7){
    const g = new THREE.Group();
    const base = mesh(new THREE.CylinderGeometry(r*1.08, r*1.2, 1.0, sides), mats.sand, 0,-0.2,0);
    const top = mesh(new THREE.CylinderGeometry(r*0.9, r*0.98, 0.35, sides), mats.grass, 0,0.38,0);
    base.rotation.y = top.rotation.y = rnd()*Math.PI;
    g.add(base, top);
    const surf = new THREE.Group(); surf.position.y = 0.55; g.add(surf);
    g.userData.surf = surf;
    return g;
  }

  // 主題地標
  const animators = [];
  const LAND = {
    poem(s){
      s.add(mesh(new THREE.ConeGeometry(1.6,3.2,6),mats.pine,-0.6,1.6,-0.4));
      s.add(mesh(new THREE.ConeGeometry(1.1,2.2,6),mats.leaf,0.9,1.1,-0.9));
      s.add(mesh(new THREE.ConeGeometry(0.55,0.7,6),mats.white,-0.6,2.85,-0.4));
      const brook = mesh(new THREE.BoxGeometry(0.5,0.05,2.6), new THREE.MeshLambertMaterial({color:0x7cc4d4}), 0.6,0.03,0.9,false); brook.rotation.y=0.5; s.add(brook);
      const moon = mesh(new THREE.SphereGeometry(0.55,16,12), new THREE.MeshLambertMaterial({color:0xfff2b0,emissive:0x8a7420}), 1.4,4.4,0.2,false); s.add(moon);
      // 桂花樹
      const gt = new THREE.Group();
      gt.add(mesh(new THREE.CylinderGeometry(0.08,0.11,0.7,5), mats.trunk, 0,0.35,0));
      gt.add(mesh(new THREE.IcosahedronGeometry(0.6,0), mats.leaf, 0,1.05,0));
      for(let i=0;i<7;i++){ const a=i/7*Math.PI*2; gt.add(mesh(new THREE.SphereGeometry(0.07,5,4), mats.gold, Math.cos(a)*0.55,1.05+Math.sin(i)*0.3,Math.sin(a)*0.55,false)); }
      gt.position.set(-1.6,0,1.0); s.add(gt);
      // 山鳥
      const bird = new THREE.Group();
      bird.add(mesh(new THREE.SphereGeometry(0.16,8,6), mats.blue, 0,0,0));
      const w1 = mesh(new THREE.BoxGeometry(0.14,0.03,0.5), mats.blue, 0,0.03,0); bird.add(w1);
      bird.add(mesh(new THREE.ConeGeometry(0.05,0.16,4), mats.gold, 0.2,0,0).rotateZ(-Math.PI/2));
      s.add(bird);
      animators.push(t=>{ const k=reduce?0:t; bird.position.set(Math.cos(k*0.9)*1.8, 2.6+Math.sin(k*2)*0.2, Math.sin(k*0.9)*1.8); bird.rotation.y = -k*0.9 - Math.PI/2; w1.rotation.x = Math.sin(k*12)*0.6; moon.position.y = 4.4+Math.sin(t*0.8)*0.12; });
      return 5.2;
    },
    gourd(s){
      for(let i=0;i<5;i++) s.add(mesh(new THREE.BoxGeometry(0.1,1.9,0.1), mats.dark, -1.6+i*0.8,0.95,-0.8));
      for(let j=0;j<3;j++) s.add(mesh(new THREE.BoxGeometry(3.3,0.04,0.04), mats.dark, 0,0.45+j*0.6,-0.8));
      for(let i=0;i<14;i++) s.add(mesh(new THREE.IcosahedronGeometry(0.28+(i%3)*0.06,0), i%2?mats.leaf:mats.leaf2, -1.5+(i%7)*0.5, 0.55+Math.floor(i/7)*0.85+(i%2)*0.2, -0.7));
      const gmat = M(0xc7cf6a), gourds = [];
      [[-0.9,1.1],[0.3,1.3],[1.2,0.9]].forEach(([x,y])=>{
        const g = new THREE.Group();
        g.add(mesh(new THREE.SphereGeometry(0.3,10,8), gmat, 0,0,0));
        g.add(mesh(new THREE.SphereGeometry(0.2,10,8), gmat, 0,0.38,0));
        g.add(mesh(new THREE.CylinderGeometry(0.03,0.03,0.2,5), mats.trunk, 0,0.6,0));
        g.position.set(x,y,-0.35); s.add(g); gourds.push(g);
      });
      for(let i=0;i<6;i++) s.add(mesh(new THREE.SphereGeometry(0.1,6,4), mats.white, -1.3+i*0.55, 1.8-(i%2)*0.5, -0.5, false));
      const bee = new THREE.Group();
      bee.add(mesh(new THREE.SphereGeometry(0.13,8,6), mats.gold, 0,0,0));
      bee.add(mesh(new THREE.BoxGeometry(0.06,0.27,0.27), mats.dark, 0,0,0,false));
      const bw = mesh(new THREE.BoxGeometry(0.3,0.02,0.1), mats.white, 0,0.13,0,false); bee.add(bw);
      s.add(bee);
      animators.push(t=>{ const k=reduce?0:t; bee.position.set(Math.sin(k*1.3)*1.4, 2.0+Math.sin(k*3)*0.25, 0.4+Math.cos(k*1.3)*0.6); bw.rotation.x = Math.sin(k*30)*0.5; gourds.forEach((g,i)=>g.rotation.z = Math.sin(t*1.5+i)*0.08); });
      return 3.4;
    },
    frog(s){
      s.add(mesh(new THREE.BoxGeometry(2.4,1.8,1.8), mats.cream, 0,0.9,-0.3));
      const roof = mesh(new THREE.ConeGeometry(1.9,0.9,4), mats.roof, 0,2.25,-0.3); roof.rotation.y=Math.PI/4; roof.scale.z=0.8; s.add(roof);
      s.add(mesh(new THREE.BoxGeometry(1.1,0.8,0.08), new THREE.MeshLambertMaterial({color:0xfff0b8,emissive:0x6a5418}), 0,1.1,0.62,false));
      s.add(mesh(new THREE.BoxGeometry(1.25,0.08,0.34), mats.wood, 0,0.66,0.72));
      s.add(mesh(new THREE.BoxGeometry(0.05,0.8,0.1), mats.wood, 0,1.1,0.66,false));
      const fg = new THREE.Group(), fm = M(0x6fa85a);
      const body = mesh(new THREE.SphereGeometry(0.22,10,8), fm, 0,0.16,0); body.scale.set(1,0.75,1.2); fg.add(body);
      [-0.1,0.1].forEach(x=>{ fg.add(mesh(new THREE.SphereGeometry(0.07,8,6), fm, x,0.31,0.12)); fg.add(mesh(new THREE.SphereGeometry(0.035,6,4), mats.dark, x,0.34,0.17,false)); });
      fg.position.set(0.3,0.7,0.8); s.add(fg);
      const bugs = []; for(let i=0;i<3;i++){ const b = mesh(new THREE.SphereGeometry(0.05,5,4), mats.gold, 0,0,0,false); s.add(b); bugs.push(b); }
      s.add(mesh(new THREE.BoxGeometry(1.3,0.25,0.4), mats.wood, -1,0.12,1.3));
      for(let i=0;i<5;i++) s.add(mesh(new THREE.SphereGeometry(0.12,6,4), i%2?mats.pink:mats.gold, -1.45+i*0.22,0.35,1.3,false));
      animators.push(t=>{ const k=reduce?0:t; fg.position.y = 0.7+Math.max(0,Math.sin(k*2.2))*0.25; bugs.forEach((b,i)=>b.position.set(Math.sin(k*2+i*2)*0.6, 1.5+Math.cos(k*3+i)*0.3, 1.0+Math.cos(k*2+i)*0.2)); });
      return 3.2;
    },
    globe(s){
      s.add(mesh(new THREE.CylinderGeometry(0.6,0.75,0.25,10), mats.wood, 0,0.12,0));
      s.add(mesh(new THREE.CylinderGeometry(0.06,0.06,0.9,6), mats.dark, 0,0.65,0));
      const gl = new THREE.Group(); gl.position.set(0,2.0,0); s.add(gl);
      const spin = new THREE.Group(); spin.rotation.z = 0.4; gl.add(spin);
      const ball = new THREE.Group(); spin.add(ball);
      ball.add(mesh(new THREE.SphereGeometry(1.0,16,12), mats.blue, 0,0,0));
      const land = M(0x8fbb6a);
      [[0.3,0.4,0.9],[-0.5,-0.2,0.8],[0.7,-0.3,-0.6],[-0.2,0.6,-0.7],[0.9,0.2,0.2],[-0.8,0.1,-0.3]].forEach(([x,y,z])=>{
        const v3 = new THREE.Vector3(x,y,z).normalize().multiplyScalar(0.9);
        const c = mesh(new THREE.IcosahedronGeometry(0.4,0), land, v3.x,v3.y,v3.z,false); c.scale.set(1,0.75,0.45); c.lookAt(0,0,0); ball.add(c);
      });
      const ring = mesh(new THREE.TorusGeometry(1.15,0.04,6,24,Math.PI), mats.gold, 0,0,0); ring.rotation.y = Math.PI/2; spin.add(ring);
      const mg = new THREE.Group();
      mg.add(mesh(new THREE.TorusGeometry(0.35,0.06,8,20), mats.dark, 0,0,0));
      mg.add(mesh(new THREE.CircleGeometry(0.33,16), new THREE.MeshLambertMaterial({color:0xcfefff,transparent:true,opacity:.5,side:THREE.DoubleSide}), 0,0,0,false));
      mg.add(mesh(new THREE.CylinderGeometry(0.05,0.05,0.6,6), mats.wood, 0,-0.65,0));
      mg.position.set(1.7,1.2,0.9); mg.rotation.z = -0.5; s.add(mg);
      const doll = person(s, -1.5, 0.8, 0xe98aa0);
      doll.add(mesh(new THREE.ConeGeometry(0.26,0.35,8), mats.pink, 0,0.12,0));
      doll.add(mesh(new THREE.SphereGeometry(0.15,8,6), mats.gold, 0,0.58,-0.05));
      animators.push(t=>{ ball.rotation.y = reduce?0:t*0.4; mg.position.y = 1.2+Math.sin(t*1.5)*0.15; });
      return 3.4;
    },
    dandelion(s){
      s.add(mesh(new THREE.CylinderGeometry(0.06,0.08,2.6,6), mats.grass2, 0,1.3,0));
      const puff = new THREE.Group(); puff.position.set(0,2.8,0); s.add(puff);
      puff.add(mesh(new THREE.SphereGeometry(0.18,8,6), mats.cream, 0,0,0));
      for(let i=0;i<42;i++){ const u=rnd()*2-1, a=rnd()*Math.PI*2, r=Math.sqrt(1-u*u); puff.add(mesh(new THREE.SphereGeometry(0.07,5,4), mats.white, r*Math.cos(a)*0.75, u*0.75, r*Math.sin(a)*0.75, false)); }
      [-1,1].forEach(d=>{ const lf = mesh(new THREE.ConeGeometry(0.18,1.0,4), mats.leaf, d*0.35,0.4,0); lf.rotation.z = -d*0.9; s.add(lf); });
      const seeds = []; for(let i=0;i<5;i++){ const sd = mesh(new THREE.SphereGeometry(0.06,5,4), mats.white, 0,0,0,false); s.add(sd); seeds.push(sd); }
      s.add(mesh(new THREE.CylinderGeometry(0.75,0.75,0.04,5), mats.red, 1.4,0.03,0.9));
      const ants = []; for(let i=0;i<4;i++){ const an = new THREE.Group(); an.add(mesh(new THREE.SphereGeometry(0.06,5,4), mats.dark, 0,0,0,false)); an.add(mesh(new THREE.SphereGeometry(0.05,5,4), mats.dark, 0.09,0,0,false)); s.add(an); ants.push(an); }
      animators.push(t=>{ const k=reduce?0:t; puff.rotation.y = k*0.3;
        seeds.forEach((sd,i)=>{ const p = (k*0.25+i/5)%1; sd.position.set(0.3+p*3.2, 2.8+p*1.8+Math.sin(k*2+i)*0.2, -0.2+Math.sin(i*1.7)*0.8*p); sd.visible = !reduce || i===0; });
        ants.forEach((an,i)=>{ const a = k*0.8+i*Math.PI/2; an.position.set(1.4+Math.cos(a)*0.4, 0.1, 0.9+Math.sin(a)*0.4); an.rotation.y = -a-Math.PI/2; }); });
      return 4.2;
    },
    dress(s){
      house(s, -1.2, -0.9, 0.3, mats.roof2);
      const dr = new THREE.Group();
      dr.add(mesh(new THREE.CylinderGeometry(0.04,0.04,1.0,6), mats.dark, 0,0.5,0));
      dr.add(mesh(new THREE.CylinderGeometry(0.35,0.4,0.1,10), mats.dark, 0,0.05,0));
      const skirt = mesh(new THREE.ConeGeometry(0.75,1.3,12), mats.blue, 0,1.6,0); dr.add(skirt);
      dr.add(mesh(new THREE.CylinderGeometry(0.22,0.3,0.6,10), mats.blue, 0,2.45,0));
      dr.add(mesh(new THREE.BoxGeometry(0.7,0.12,0.2), mats.blue, 0,2.72,0));
      dr.position.set(0.6,0,0.3); s.add(dr);
      s.add(mesh(new THREE.CylinderGeometry(0.06,0.08,2.6,6), mats.dark, 1.9,1.3,-0.7));
      s.add(mesh(new THREE.SphereGeometry(0.22,10,8), new THREE.MeshLambertMaterial({color:0xfff2b0,emissive:0x8a7420}), 1.9,2.7,-0.7,false));
      for(let i=0;i<7;i++) s.add(mesh(new THREE.BoxGeometry(0.08,0.6,0.08), mats.white, -2.0+i*0.3,0.3,1.4));
      s.add(mesh(new THREE.BoxGeometry(1.9,0.06,0.06), mats.white, -1.1,0.45,1.4));
      for(let i=0;i<5;i++) s.add(mesh(new THREE.SphereGeometry(0.13,6,4), [mats.pink,mats.gold,mats.red][i%3], -1.8+i*0.35,0.2,1.0,false));
      animators.push(t=>{ dr.rotation.y = Math.sin(t*1.2)*0.35; const sc = 1+(reduce?0:Math.sin(t*2.4)*0.04); skirt.scale.x = skirt.scale.z = sc; });
      return 3.4;
    }
  };

  // 佈局：起點港在中央，六座島沿一圈排列，用木橋依序相連
  const R = 12.5 + Math.max(0, LESSONS.length-6)*1.2;
  const islands = [];
  const pickables = [];
  const home = islandBase(3.6, 8); scene.add(home);
  {
    const s = home.userData.surf;
    const lh = new THREE.Group();
    for(let i=0;i<4;i++) lh.add(mesh(new THREE.CylinderGeometry(0.55-i*0.06,0.6-i*0.06,0.7,10), i%2?mats.white:mats.red, 0,0.35+i*0.7,0));
    lh.add(mesh(new THREE.CylinderGeometry(0.42,0.42,0.5,10), new THREE.MeshLambertMaterial({color:0xfff2b0,emissive:0x664400}), 0,3.05,0));
    lh.add(mesh(new THREE.ConeGeometry(0.55,0.6,10), mats.dark, 0,3.6,0));
    s.add(lh);
    house(s,1.7,0.9,0.4); house(s,-1.8,0.6,-0.3,mats.roof2);
    tree(s,1.3,-1.6); tree(s,-1.0,-1.9,0.9); tree(s,-2.2,-0.8,0.8); tree(s,2.4,-0.6,0.8);
    person(s,0.6,1.8,0xe0643a); person(s,-0.4,2.0,0x4f8fc0);
    home.userData.anchor = new THREE.Vector3(0,5,0);
  }
  LESSONS.forEach((l,i)=>{
    const a = -Math.PI*0.80 + i*(Math.PI*2/Math.max(6,LESSONS.length));
    const x = Math.cos(a)*R, z = Math.sin(a)*R*0.92;
    const r = 3.2 + (i%2)*0.35;
    const g = islandBase(r, 6+(i%3));
    g.position.set(x,0,z);
    const s = g.userData.surf;
    const top = LAND[l.landmark](s);
    // 周圍的樹與房子
    const n = 6;
    for(let k=0;k<n;k++){ const aa = rnd()*Math.PI*2, rr = r*0.62 + rnd()*r*0.18; tree(s, Math.cos(aa)*rr, Math.sin(aa)*rr, 0.7+rnd()*0.35); }
    house(s, Math.cos(a+2.4)*r*0.55, Math.sin(a+2.4)*r*0.55, rnd()*3, i%2?mats.roof:mats.roof2);
    // 完成旗
    const flag = new THREE.Group();
    flag.add(mesh(new THREE.CylinderGeometry(0.05,0.05,2.6,6), mats.dark, 0,1.3,0));
    const cloth = mesh(new THREE.BoxGeometry(1.0,0.6,0.04), mats.gold, 0.52,2.25,0); flag.add(cloth);
    flag.position.set(Math.cos(a+3.9)*r*0.55, 0, Math.sin(a+3.9)*r*0.55);
    flag.visible = false; s.add(flag);
    g.userData = Object.assign(g.userData, {lesson:l.id, flag, cloth, baseY:0, anchor:new THREE.Vector3(x, top+1.6, z), angle:a});
    g.traverse(o=>{ o.userData.lesson = l.id; });
    scene.add(g); islands.push(g); pickables.push(g);
  });

  // 木橋
  function bridge(p, q){
    const dx=q.x-p.x, dz=q.z-p.z, len=Math.hypot(dx,dz);
    const g = new THREE.Group();
    const planks = Math.floor(len/0.45);
    for(let k=0;k<planks;k++){ const pl = mesh(new THREE.BoxGeometry(0.36,0.12,1.2), k%2?mats.wood:M(0xa77a52), -len/2+0.22+k*0.45, 0, 0); g.add(pl); }
    g.add(mesh(new THREE.BoxGeometry(len,0.06,0.06), mats.trunk, 0,0.35,0.58), mesh(new THREE.BoxGeometry(len,0.06,0.06), mats.trunk, 0,0.35,-0.58));
    g.position.set((p.x+q.x)/2, 0.42, (p.z+q.z)/2);
    g.rotation.y = -Math.atan2(dz,dx);
    scene.add(g);
  }
  const edge = (A,B,rA,rB)=>{ const d=new THREE.Vector3().subVectors(B,A).setY(0).normalize(); return [A.clone().addScaledVector(d,rA*0.85), B.clone().addScaledVector(d,-rB*0.85)]; };
  { const [p,q] = edge(home.position, islands[0].position, 3.6, 3.2); bridge(p,q); }
  for(let i=0;i<islands.length-1;i++){ const [p,q] = edge(islands[i].position, islands[i+1].position, 3.3, 3.3); bridge(p,q); }

  // 小島、礁石、帆船
  [[-24,-6,1.6],[25,-12,1.9],[22,13,1.4],[-21,15,1.7],[2,-24,1.5],[0,22,1.2]].forEach(([x,z,r])=>{
    const g = islandBase(r,6); g.position.set(x,0,z); const s=g.userData.surf; tree(s,0,0,0.8); if(r>1.5) tree(s,r*0.4,r*0.2,0.6); scene.add(g);
  });
  [[-15,-15],[17,1],[-6,18],[9,-19]].forEach(([x,z])=>{ scene.add(mesh(new THREE.DodecahedronGeometry(0.9,0), mats.rock, x,0,z)); });
  const boats=[];
  for(let i=0;i<4;i++){
    const b = new THREE.Group();
    b.add(mesh(new THREE.BoxGeometry(1.3,0.35,0.5), mats.wood, 0,0,0));
    const sail = new THREE.Shape(); sail.moveTo(0,0); sail.lineTo(0,1.2); sail.lineTo(0.8,0); sail.lineTo(0,0);
    const sm = mesh(new THREE.ShapeGeometry(sail), new THREE.MeshLambertMaterial({color:i%2?0xfbf8f1:0xe0643a, side:THREE.DoubleSide}), -0.2,0.2,0); b.add(sm);
    b.add(mesh(new THREE.CylinderGeometry(0.03,0.03,1.4,4), mats.dark, -0.2,0.85,0));
    scene.add(b); boats.push({b, r:19+i*2.5, sp:0.05+i*0.015, ph:i*1.7});
  }

  // 標籤
  const pins = $('#pins');
  const homePin = document.createElement('div'); homePin.className='pin home'; homePin.textContent='起點港'; pins.appendChild(homePin);
  const pinEls = islands.map(g=>{
    const l = LESSONS.find(x=>x.id===g.userData.lesson);
    const b = document.createElement('button'); b.type='button'; b.className='pin';
    b.setAttribute('aria-label','第'+l.id+'課 '+l.title);
    b.onclick = ()=>openLesson(l.id);
    pins.appendChild(b); return b;
  });
  window.refreshPins = function(){
    islands.forEach((g,i)=>{
      const l = LESSONS[i], n = lessonStars(l.id);
      pinEls[i].className = 'pin'+(n===PER?' done':'');
      pinEls[i].innerHTML = '<span class="no">'+pad(l.id)+'</span><span>'+l.title+'</span><span class="st">★'+n+'/'+PER+'</span>';
      g.userData.flag.visible = n===PER;
    });
  };
  window.refreshPins();

  // 點選與滑過
  const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  let hover = null, downAt = null;
  function pick(e){
    const r = renderer.domElement.getBoundingClientRect();
    mouse.set(((e.clientX-r.left)/r.width)*2-1, -((e.clientY-r.top)/r.height)*2+1);
    ray.setFromCamera(mouse,camera);
    const hit = ray.intersectObjects(pickables,true)[0];
    return hit ? hit.object.userData.lesson : null;
  }
  renderer.domElement.addEventListener('pointerdown',e=>{ downAt=[e.clientX,e.clientY]; });
  renderer.domElement.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse') return; hover = pick(e); renderer.domElement.style.cursor = hover?'pointer':'grab'; });
  renderer.domElement.addEventListener('pointerup',e=>{
    if(!downAt) return; const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt=null;
    if(moved>6) return; const id = pick(e); if(id) openLesson(id);
  });

  // 鏡頭聚焦
  let camGoal = null, focused = null;
  const homeView = { pos:new THREE.Vector3(0,30,34), tgt:new THREE.Vector3(0,0,1) };
  window.focusIsland = function(id){
    focused = id;
    if(id==null){ camGoal = {pos:homeView.pos.clone(), tgt:homeView.tgt.clone()}; return; }
    const g = islands.find(x=>x.userData.lesson===id); if(!g) return; const p = g.position;
    const wide = innerWidth>640;
    const tgt = p.clone().add(new THREE.Vector3(wide?4.5:0, 0, wide?0:3.5));
    camGoal = { pos: tgt.clone().add(new THREE.Vector3(0,17,19)), tgt };
  };
  let celebrateT = -1, celebrateId = null;
  window.celebrate = id => { celebrateId=id; celebrateT=0; };

  function resize(){
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w,h); camera.aspect = w/h;
    const far = w<640 ? 1.45 : 1;
    homeView.pos.set(0,30*far*(R/12.5),34*far*(R/12.5));
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize); resize();
  camera.position.copy(homeView.pos).multiplyScalar(1.5); camGoal = {pos:homeView.pos.clone(), tgt:homeView.tgt.clone()};

  const clock = new THREE.Clock(); const v = new THREE.Vector3();
  function loop(){
    const dt = Math.min(clock.getDelta(),0.05), t = clock.elapsedTime;
    if(camGoal){
      camera.position.lerp(camGoal.pos, 1-Math.pow(0.002,dt));
      controls.target.lerp(camGoal.tgt, 1-Math.pow(0.002,dt));
      if(camera.position.distanceTo(camGoal.pos)<0.05) camGoal=null;
    }
    controls.update();
    animators.forEach(f=>f(t));
    islands.forEach((g,i)=>{
      const lift = (hover===g.userData.lesson || focused===g.userData.lesson) ? 0.45 : 0;
      let y = reduce ? lift : Math.sin(t*0.8+i)*0.08 + lift;
      if(celebrateId===g.userData.lesson && celebrateT>=0){ y += Math.sin(celebrateT*8)*Math.max(0,1-celebrateT)*0.8; }
      g.position.y += (y-g.position.y)*Math.min(1,dt*6);
      if(g.userData.flag.visible) g.userData.cloth.rotation.y = Math.sin(t*3+i)*0.25;
    });
    if(celebrateT>=0){ celebrateT+=dt; if(celebrateT>1.5) celebrateT=-1; }
    boats.forEach(o=>{ const a = o.ph + t*o.sp*(reduce?0:1); o.b.position.set(Math.cos(a)*o.r, -0.15+Math.sin(t*2+o.ph)*0.06, Math.sin(a)*o.r*0.85); o.b.rotation.y = -a; });
    renderer.render(scene,camera);
    // 標籤位置
    const W = innerWidth, H = innerHeight;
    const place = (el, anchor, yOff)=>{
      v.copy(anchor); v.y += yOff; v.project(camera);
      const vis = v.z<1 && v.x>-1.2 && v.x<1.2 && v.y>-1.2 && v.y<1.2;
      el.style.display = vis?'':'none';
      if(vis){ el.style.left = ((v.x+1)/2*W)+'px'; el.style.top = ((1-v.y)/2*H)+'px'; }
    };
    place(homePin, home.userData.anchor, 0);
    islands.forEach((g,i)=>place(pinEls[i], g.userData.anchor, g.position.y));
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>

</body></html>
